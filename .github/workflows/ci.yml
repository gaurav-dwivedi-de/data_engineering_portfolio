name: Weather Intelligence Platform CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.csv'
      - '**/*.parquet'
      - '**/*.png'
      - '**/*.pkl'

  pull_request:
    branches:
      - main

jobs:

  changes:
    runs-on: ubuntu-latest

    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect deployable changes
        id: detect
        run: |
          deploy=false

          while IFS= read -r file; do
            case "$file" in

              # Docker / dependency configuration
              Dockerfile|docker_requirements.txt|requirements.txt)
                deploy=true
                ;;

              # CI/CD deployment configuration
              .github/workflows/ci.yml|.github/scripts/*)
                deploy=true
                ;;

              # Docker Compose configuration
              docker-compose.yml|docker-compose.resolved.yml)
                deploy=true
                ;;

              # Kubernetes configuration
              k8/*)
                deploy=true
                ;;

              # Test files: CI only, no deployment
              tests/*)
                ;;

              # Any Python source file anywhere in the repository
              *.py)
                deploy=true
                ;;

            esac
          done < <(git diff --name-only HEAD^ HEAD)

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Deploy required: $deploy"

  ci:
    needs: changes

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify Python
        run: python --version

      - name: Install limited test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests scikit-learn joblib

      - name: Verify repository structure
        run: |
          test -f Dockerfile
          test -d k8
          test -d k8/postgres
          test -d k8/minio
          test -d orchestration
          test -d dags
          test -d w10_fastapi_service

      - name: Run limited tests
        run: python -m unittest tests/test_project_imports.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: CI validation successful
        run: echo "P2-W4 CI validation completed successfully"

      - name: Image publishing completed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
        run: echo "P2-W4 container image published successfully"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'

    needs:
      - changes
      - ci

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate deployment script
        run: |
          bash -n .github/scripts/deploy-oracle-k3s.sh
          test -s .github/scripts/deploy-oracle-k3s.sh

      - name: Deploy workloads to Oracle K3s
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_k3s_key
          chmod 600 ~/.ssh/oracle_k3s_key

          : "${ORACLE_KNOWN_HOSTS:?Missing ORACLE_KNOWN_HOSTS secret}"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/oracle_k3s_key \
            -o StrictHostKeyChecking=yes \
            "$ORACLE_USER@$ORACLE_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" \
            < .github/scripts/deploy-oracle-k3s.sh